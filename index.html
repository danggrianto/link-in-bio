<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Caf&eacute;s &mdash; Caf&eacute; Square One &amp; Eggcellent Cafe</title>
<meta name="description" content="Links to Caf&eacute; Square One and Eggcellent Cafe.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1613" media="(prefers-color-scheme: dark)">

<meta property="og:type" content="website">
<meta property="og:title" content="Our Caf&eacute;s">
<meta property="og:description" content="Caf&eacute; Square One &middot; Eggcellent Cafe">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23b4642e'/%3E%3Ccircle cx='50' cy='50' r='24' fill='%23ffd166'/%3E%3C/svg%3E">

<style>
  :root {
    --bg: #f6efe6;
    --bg-accent: #efe2d2;
    --card: #fffdfa;
    --ink: #2a211b;
    --ink-soft: #6d5e52;
    --line: rgba(42, 33, 27, .12);
    --shadow: 0 1px 2px rgba(42,33,27,.06), 0 8px 24px rgba(42,33,27,.08);
    --shadow-lift: 0 2px 4px rgba(42,33,27,.08), 0 14px 32px rgba(42,33,27,.14);
    --brand-sq1: #b4642e;
    --brand-egg: #e0a21a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1613;
      --bg-accent: #241e19;
      --card: #262019;
      --ink: #f4ece2;
      --ink-soft: #b3a496;
      --line: rgba(244, 236, 226, .14);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      --shadow-lift: 0 2px 4px rgba(0,0,0,.45), 0 14px 32px rgba(0,0,0,.5);
      --brand-sq1: #e08b4c;
      --brand-egg: #ffc94a;
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: max(2rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(90% 60% at 50% 0%, var(--bg-accent), transparent 70%),
      var(--bg);
    color: var(--ink);
    font: 400 16px/1.5 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    width: 100%;
    max-width: 24rem;
    text-align: center;
  }

  .mark {
    width: 72px;
    height: 72px;
    margin: 0 auto 1.25rem;
    border-radius: 24px;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, var(--brand-sq1), var(--brand-egg));
    box-shadow: var(--shadow);
  }

  .mark svg { width: 38px; height: 38px; display: block; }

  h1 {
    margin: 0 0 .35rem;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -.015em;
  }

  .tagline {
    margin: 0 0 2rem;
    color: var(--ink-soft);
    font-size: .95rem;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: .875rem;
  }

  .link {
    --accent: var(--brand-sq1);
    position: relative;
    display: flex;
    align-items: center;
    gap: .875rem;
    min-height: 68px;
    padding: .875rem 1rem;
    border-radius: 18px;
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;
    text-align: left;
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }

  .link::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 4px;
    background: var(--accent);
  }

  .link--egg { --accent: var(--brand-egg); }

  .link .icon {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    margin-left: .25rem;
    border-radius: 13px;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent);
  }

  .link .icon svg { width: 22px; height: 22px; display: block; }

  .link .text { min-width: 0; flex: 1 1 auto; }

  .link .name {
    display: block;
    font-weight: 650;
    font-size: 1.0625rem;
    letter-spacing: -.01em;
  }

  .link .host {
    display: block;
    margin-top: .1rem;
    font-size: .8125rem;
    color: var(--ink-soft);
  }

  .link .chev {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    color: var(--ink-soft);
    transition: transform .18s ease;
  }

  @media (hover: hover) {
    .link:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lift);
      border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
    }
    .link:hover .chev { transform: translateX(3px); }
  }

  .link:active { transform: translateY(0) scale(.985); }

  .link:focus-visible {
    outline: 2.5px solid var(--accent);
    outline-offset: 3px;
  }

  footer {
    margin-top: 2.25rem;
    font-size: .75rem;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fffdfa" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9Z"/>
      <path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/>
      <path d="M7 2.5c-.6 1 -.6 1.8 0 2.8M11 2.5c-.6 1 -.6 1.8 0 2.8"/>
    </svg>
  </div>

  <h1>Our Caf&eacute;s</h1>
  <p class="tagline">Two places, one kitchen philosophy. Pick a door.</p>

  <nav class="links" aria-label="Our websites">
    <a class="link" href="https://cafesquareone.com" rel="noopener">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="3.5" width="17" height="17" rx="4"/>
          <rect x="8.5" y="8.5" width="7" height="7" rx="1.6"/>
        </svg>
      </span>
      <span class="text">
        <span class="name">Caf&eacute; Square One</span>
        <span class="host">cafesquareone.com</span>
      </span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m9 5 7 7-7 7"/>
      </svg>
    </a>

    <a class="link link--egg" href="https://eggcellent.cafe" rel="noopener">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c3.3 0 6 4.6 6 8.6S15.3 19 12 19s-6-3.4-6-7.4S8.7 3 12 3Z"/>
          <circle cx="12" cy="12.5" r="2.6"/>
        </svg>
      </span>
      <span class="text">
        <span class="name">Eggcellent Cafe</span>
        <span class="host">eggcellent.cafe</span>
      </span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m9 5 7 7-7 7"/>
      </svg>
    </a>
  </nav>

  <footer>Thanks for stopping by &#9749;</footer>
</main>
</body>
</html>
