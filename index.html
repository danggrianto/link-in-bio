<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Cafes &mdash; Cafe Square One &amp; Eggcellent Cafe</title>
<meta name="description" content="Cafe Square One and Eggcellent Cafe — breakfast, brunch, lunch and specialty coffee in Philadelphia.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">

<meta property="og:type" content="website">
<meta property="og:title" content="Our Cafes">
<meta property="og:description" content="Cafe Square One &middot; Eggcellent Cafe">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f4073'/%3E%3Cpath d='M32 0h18a14 14 0 0 1 14 14v36a14 14 0 0 1-14 14H32Z' fill='%23fad02c'/%3E%3C/svg%3E">

<style>
  :root {
    /* Cafe Square One — sampled from cafesquareone.com */
    --cso-navy: #1f4073;
    --cso-gold: #fad02c;
    /* Eggcellent Cafe — sampled from eggcellent.cafe */
    --egg-yellow: #ffd70c;
    --egg-cream: #fff8e7;
    --egg-ink: #15120c;
    /* accents used for chevron, focus ring and hover border — flipped per scheme */
    --cso-accent: #1f4073;
    --egg-accent: #a67c00;

    --bg: #f7f3ec;
    --bg-accent: #efe7d9;
    --card: #fffdfa;
    --ink: #241f19;
    --ink-soft: #6d6257;
    --line: rgba(36, 31, 25, .12);
    --shadow: 0 1px 2px rgba(36,31,25,.06), 0 8px 24px rgba(36,31,25,.08);
    --shadow-lift: 0 2px 4px rgba(36,31,25,.08), 0 16px 34px rgba(36,31,25,.15);
    --plate-cso: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141210;
      --bg-accent: #1f1b16;
      --card: #201c17;
      --ink: #f4ede3;
      --ink-soft: #ab9f92;
      --line: rgba(244, 237, 227, .14);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      --shadow-lift: 0 2px 4px rgba(0,0,0,.45), 0 16px 34px rgba(0,0,0,.5);
      --cso-accent: var(--cso-gold);
      --egg-accent: var(--egg-yellow);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    padding: max(2rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(95% 55% at 50% 0%, var(--bg-accent), transparent 70%),
      var(--bg);
    color: var(--ink);
    font: 400 16px/1.5 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main { width: 100%; max-width: 23rem; text-align: center; }

  h1 {
    margin: 0 0 .3rem;
    font-size: 1.375rem;
    font-weight: 700;
    letter-spacing: -.015em;
  }

  .sub {
    margin: 0 0 1.75rem;
    color: var(--ink-soft);
    font-size: .9375rem;
  }

  .cards { display: flex; flex-direction: column; gap: 1rem; }

  .card {
    --accent: var(--cso-accent);
    display: block;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }

  /* Brand plate: each official logo gets the backing it needs to stay legible. */
  .plate {
    display: grid;
    place-items: center;
    height: 104px;
    padding: 1rem;
  }

  .plate img { display: block; width: auto; max-width: 100%; object-fit: contain; }

  .card--cso .plate { background: var(--plate-cso); }
  .card--cso .plate img { height: 72px; }

  .card--egg { --accent: var(--egg-accent); }
  .card--egg .plate { background: var(--egg-ink); }
  .card--egg .plate img { height: 38px; }

  .body {
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .8125rem 1rem;
    border-top: 1px solid var(--line);
    text-align: left;
  }

  .text { flex: 1 1 auto; min-width: 0; }

  .name {
    display: block;
    font-weight: 650;
    font-size: 1rem;
    letter-spacing: -.01em;
  }

  .host {
    display: block;
    margin-top: .1rem;
    font-size: .8125rem;
    color: var(--ink-soft);
    overflow-wrap: anywhere;
  }

  .chev {
    flex: 0 0 auto;
    width: 20px; height: 20px;
    color: var(--accent);
    transition: transform .18s ease;
  }
  @media (hover: hover) {
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lift);
      border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
    }
    .card:hover .chev { transform: translateX(3px); }
  }

  .card:active { transform: translateY(0) scale(.99); }

  .card:focus-visible {
    outline: 2.5px solid var(--accent);
    outline-offset: 3px;
  }

  footer { margin-top: 2rem; font-size: .75rem; color: var(--ink-soft); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Our Cafes</h1>
  <p class="sub">Philadelphia. Pick a door.</p>

  <nav class="cards" aria-label="Our websites">

    <a class="card card--cso" href="https://cafesquareone.com" rel="noopener">
      <span class="plate">
        <img src="images/cafe-square-one-logo.png" alt="Cafe Square One logo"
             width="256" height="256" loading="eager" decoding="async">
      </span>
      <span class="body">
        <span class="text">
          <span class="name">It All Starts Here</span>
          <span class="host">cafesquareone.com</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 5 7 7-7 7"/>
        </svg>
      </span>
    </a>

    <a class="card card--egg" href="https://eggcellent.cafe" rel="noopener">
      <span class="plate">
        <img src="images/eggcellent-logo.png" alt="Eggcellent Cafe logo"
             width="640" height="134" loading="eager" decoding="async">
      </span>
      <span class="body">
        <span class="text">
          <span class="name">Have an Eggcellent Day</span>
          <span class="host">eggcellent.cafe</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 5 7 7-7 7"/>
        </svg>
      </span>
    </a>

  </nav>

  <footer>Thanks for stopping by &#9749;</footer>
</main>
</body>
</html>
